<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學打地鼠大挑戰 (終極完整版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .math-font { font-family: 'Fredoka', 'Noto Sans TC', sans-serif; }

        /* 遊戲背景日夜漸變 */
        .sky-day { background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 60%, #e0f2fe 100%); transition: background 2s ease; }
        .sky-sunset { background: linear-gradient(180deg, #ea580c 0%, #fb923c 55%, #fde047 100%); transition: background 2s ease; }
        .sky-night { background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 60%, #312e81 100%); transition: background 2s ease; }

        /* 狂熱模式特效 */
        @keyframes feverGlow {
            0%, 100% { box-shadow: inset 0 0 35px rgba(239, 68, 68, 0.55), 0 0 25px rgba(245, 158, 11, 0.7); }
            50% { box-shadow: inset 0 0 75px rgba(245, 158, 11, 0.85), 0 0 55px rgba(239, 68, 68, 0.9); }
        }
        .fever-active { animation: feverGlow 0.9s infinite alternate; }

        /* 動畫特效 */
        @keyframes boardShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 4px); }
            40% { transform: translate(5px, -4px); }
            60% { transform: translate(-4px, 3px); }
            80% { transform: translate(4px, -2px); }
        }
        .shake-active { animation: boardShake 0.28s ease-in-out; }

        @keyframes hammerHit {
            0% { transform: translate(25px, -55px) rotate(40deg) scale(0.9); opacity: 0; }
            25% { transform: translate(15px, -45px) rotate(45deg) scale(1.05); opacity: 1; }
            55% { transform: translate(-8px, 10px) rotate(-22deg) scale(1.15, 0.88); opacity: 1; }
            75% { transform: translate(-4px, -4px) rotate(-10deg) scale(1); opacity: 1; }
            100% { transform: translate(20px, -50px) rotate(30deg) scale(0.9); opacity: 0; }
        }
        .hammer-anim { animation: hammerHit 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards; transform-origin: 80% 85%; }

        .mole-wrapper { transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); transform: translateY(105%); }
        .mole-wrapper.up { transform: translateY(0%); }
        .mole-wrapper.bonked { transform: translateY(18%) scale(1.15, 0.72); transition: transform 0.12s ease-out; }

        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #fef3c7; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #d97706; border-radius: 8px; }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-amber-50">

    <!-- 頂部導覽列 -->
    <header class="w-full bg-[#4a2610] text-amber-50 px-3 md:px-6 py-2.5 flex flex-wrap items-center justify-between gap-2 border-b-4 border-[#2e1608] z-30 shadow-lg">
        <div class="flex items-center gap-2.5">
            <span class="text-2xl md:text-3xl">🐹</span>
            <div>
                <h1 class="text-base md:text-xl font-black tracking-wide text-amber-300 leading-tight">數學打地鼠大挑戰</h1>
                <p id="header-subtitle" class="text-[11px] md:text-xs text-amber-100/80 font-bold">小一至國三 ｜ 108課綱</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-1.5 md:gap-2">
            <button onclick="openAdminModal()" class="px-2.5 py-1.5 rounded-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold text-xs md:text-sm border-2 border-emerald-400 shadow">
                🔐 題庫管理
            </button>
            <button onclick="openLeaderboardModal()" class="px-2.5 py-1.5 rounded-full bg-amber-500 hover:bg-amber-400 text-amber-950 font-black text-xs md:text-sm border-2 border-amber-200 shadow">
                🏆 排行榜
            </button>
            <button id="btn-sound" onclick="toggleSound()" class="px-2.5 py-1.5 rounded-full bg-amber-800 hover:bg-amber-700 text-amber-100 font-bold text-xs md:text-sm border-2 border-amber-600 shadow">
                🔊 音效: 開
            </button>
            <button id="btn-fullscreen" onclick="toggleFullscreen()" class="px-2.5 py-1.5 rounded-full bg-indigo-700 hover:bg-indigo-600 text-white font-bold text-xs md:text-sm border-2 border-indigo-400 shadow">
                ⛶ 全螢幕
            </button>
            <button onclick="backToMenu()" class="px-2.5 py-1.5 rounded-full bg-rose-700 hover:bg-rose-600 text-white font-bold text-xs md:text-sm border-2 border-rose-400 shadow">
                ⚙️ 重選範圍
            </button>
        </div>
    </header>

    <div id="toast-msg" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-amber-950/95 text-amber-100 border-2 border-amber-400 px-5 py-2.5 rounded-full font-extrabold text-sm shadow-2xl transition-all"></div>

    <main id="game-stage" class="flex-grow relative flex flex-col items-center justify-between sky-day overflow-hidden py-3 px-2 md:px-6">
        <div id="celestial-body" class="absolute top-6 right-8 w-16 h-16 md:w-20 md:h-20 rounded-full bg-yellow-300 border-4 border-amber-400 shadow-[0_0_40px_rgba(250,204,21,0.9)] transition-all duration-1000 pointer-events-none z-0"></div>
        <div class="absolute bottom-0 left-0 right-0 h-[58%] bg-gradient-to-b from-[#38a169] to-[#276749] rounded-t-[50%_18%] pointer-events-none z-0 border-t-4 border-[#68d391]/50"></div>
        <div class="absolute bottom-0 left-0 right-0 h-[44%] bg-gradient-to-b from-[#48bb78] via-[#2f855a] to-[#22543d] rounded-t-[40%_15%] pointer-events-none z-0 shadow-inner"></div>
        <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

        <!-- 主選單 -->
        <section id="menu-screen" class="relative z-20 my-auto w-full max-w-3xl bg-[#fef9c3] border-[6px] border-[#92400e] rounded-3xl shadow-[0_12px_0_#5b2106,0_20px_35px_rgba(0,0,0,0.4)] p-4 md:p-7">
            <div class="text-center mb-4">
                <div class="inline-flex flex-wrap justify-center gap-1.5 bg-amber-200/80 p-1.5 rounded-2xl border-2 border-amber-600 mb-2">
                    <button id="mode-btn-builtin" onclick="selectBankMode('builtin')" class="px-3.5 py-1.5 rounded-xl font-black text-xs md:text-sm bg-amber-800 text-white shadow">

                    </button>
                    <button id="mode-btn-custom" onclick="selectBankMode('custom')" class="px-3.5 py-1.5 rounded-xl font-black text-xs md:text-sm text-amber-900 hover:bg-amber-300/60">
                        📂 教師自訂題庫 (<span id="menu-custom-count">0</span>)
                    </button>
                    <button id="mode-btn-wrongbook" onclick="selectBankMode('wrongbook')" class="px-3.5 py-1.5 rounded-xl font-black text-xs md:text-sm text-indigo-900 hover:bg-indigo-200/60">

                    </button>
                </div>
                <h2 class="text-2xl md:text-3xl font-black text-amber-950">請選擇挑戰程度與範圍</h2>
                <p class="text-xs md:text-sm text-amber-800 font-bold mt-1">敲中正解得分！連續答對 5 題啟動 <span class="text-red-600 font-black">🔥 狂熱模式</span>，留意隨機出現的 <span class="text-sky-700 font-black">⏳加時</span> 與 <span class="text-purple-700 font-black">💣炸彈</span>！</p>
                <div class="mt-2.5 flex justify-center">
                    <label class="cursor-pointer inline-flex items-center bg-indigo-600 hover:bg-indigo-500 text-white font-black text-xs px-4 py-1.5 rounded-full shadow">
                        📂 學生端：匯入錯題複習本 (.txt) 
                        <input type="file" accept=".txt" class="hidden" onchange="importStudentWrongBookTxt(event)" />
                    </label>
                </div>
            </div>

            <!-- 年級 -->
            <div class="mb-4">

                    <span class="w-6 h-6 rounded-full bg-amber-800 text-white text-xs flex items-center justify-center">1</span> 選擇年級：
                </label>
                <div id="grade-buttons-grid" class="grid grid-cols-3 md:grid-cols-6 gap-2"></div>
            </div>

            <!-- 範圍 -->
            <div id="builtin-options-panel" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="text-sm md:text-base font-black text-amber-950 flex items-center gap-1.5 mb-2">
                        <span class="w-6 h-6 rounded-full bg-amber-800 text-white text-xs flex items-center justify-center">2</span> 學期：
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="sem-btn-1" onclick="selectSemester(1)" class="py-2.5 px-3 rounded-xl font-black text-sm bg-amber-800 text-white shadow border-2 border-amber-950">🍂 上學期</button>
                        <button id="sem-btn-2" onclick="selectSemester(2)" class="py-2.5 px-3 rounded-xl font-black text-sm bg-white text-amber-900 border-2 border-amber-600 hover:bg-amber-100">🌱 下學期</button>
                    </div>
                </div>
                <div>
                    <label class="text-sm md:text-base font-black text-amber-950 flex items-center gap-1.5 mb-2">
                        <span class="w-6 h-6 rounded-full bg-amber-800 text-white text-xs flex items-center justify-center">3</span> 段考範圍：
                    </label>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="exam-btn-1" onclick="selectExam(1)" class="py-2.5 px-2 rounded-xl font-black text-xs md:text-sm bg-emerald-700 text-white shadow border-2 border-emerald-950">第 1 次</button>
                        <button id="exam-btn-2" onclick="selectExam(2)" class="py-2.5 px-2 rounded-xl font-black text-xs md:text-sm bg-white text-amber-900 border-2 border-amber-600 hover:bg-amber-100">第 2 次</button>
                        <button id="exam-btn-3" onclick="selectExam(3)" class="py-2.5 px-2 rounded-xl font-black text-xs md:text-sm bg-white text-amber-900 border-2 border-amber-600 hover:bg-amber-100">第 3 次</button>
                    </div>
                </div>
            </div>

            <!-- 單一觀念特訓 (NEW) -->
            <div id="concept-focus-panel" class="bg-indigo-50 border-2 border-indigo-400 rounded-2xl p-3.5 mb-4">
                <label class="text-sm md:text-base font-black text-indigo-950 flex items-center gap-1.5 mb-2">
                    <span class="w-6 h-6 rounded-full bg-indigo-700 text-white text-xs flex items-center justify-center">4</span> 單一觀念針對特訓 (可選)：
                </label>
                <select id="concept-focus-select" class="w-full bg-white border-2 border-indigo-600 rounded-xl px-3 py-2 text-sm font-black text-indigo-950 focus:outline-none">
                    <option value="0">🌟 全範圍綜合隨機</option>
                </select>
            </div>

            <div id="custom-options-panel" class="hidden mb-4 bg-emerald-50 border-2 border-emerald-600 rounded-2xl p-3.5">
                <label class="text-sm md:text-base font-black text-emerald-950">選擇自訂題庫名稱：</label>
                <select id="custom-subject-select" onchange="updateScopeDescription()" class="w-full mt-2 bg-white border-2 border-emerald-600 rounded-xl px-3 py-2 text-sm font-black focus:outline-none"></select>
            </div>

            <div id="wrongbook-options-panel" class="hidden mb-4 bg-indigo-50 border-2 border-indigo-600 rounded-2xl p-3.5">
                <p id="wrongbook-panel-info" class="text-xs font-bold text-indigo-800">尚未匯入錯題本。</p>
            </div>

            <!-- 速度與模式 -->
            <div class="bg-amber-100/90 border-2 border-amber-500 rounded-2xl p-3.5 mb-5 flex flex-col gap-3">
                <div class="flex items-center justify-between gap-2 border-b border-amber-300 pb-2">
                    <span class="text-xs font-black text-amber-900">地鼠速度：</span>
                    <select id="speed-select" class="bg-white border-2 border-amber-700 rounded-xl px-2 py-1 text-xs md:text-sm font-black text-amber-950">
                        <option value="slow">🐢 慢速 (4.5秒)</option>
                        <option value="normal" selected>🐹 標準 (3.5秒)</option>
                        <option value="fast">⚡ 快速 (2.5秒)</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <button id="playmode-btn-timed" onclick="selectPlayMode('timed')" class="py-2 px-3 rounded-xl font-black text-xs md:text-sm bg-amber-800 text-white shadow border-2 border-amber-950">⏱️ 限時 90 秒</button>
                    <button id="playmode-btn-practice" onclick="selectPlayMode('practice')" class="py-2 px-3 rounded-xl font-black text-xs md:text-sm bg-white text-amber-900 border-2 border-amber-600 hover:bg-amber-200">♾️ 不限時練習</button>
                </div>
            </div>

            <div class="text-center">
                <button onclick="startGame()" class="px-10 py-3.5 rounded-full bg-gradient-to-b from-emerald-500 to-emerald-700 hover:from-emerald-400 text-white font-black text-lg md:text-xl border-4 border-emerald-950 shadow-[0_6px_0_#064e3b] active:translate-y-1 active:shadow-none transition-all">
                    🔨 開始打地鼠解題！
                </button>
            </div>
        </section>

        <!-- 遊戲畫面 -->
        <section id="play-screen" class="hidden relative z-20 w-full max-w-4xl flex-col items-center justify-between flex-grow my-auto">
            <div id="question-board" class="w-full bg-[#b45309] border-[6px] border-[#78350f] rounded-3xl p-3 md:p-4 shadow-[0_10px_0_#451a03] mb-2">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1">
                    <div class="flex items-center gap-2">
                        <div class="bg-[#451a03] text-amber-200 px-3.5 py-1 rounded-full border-2 border-amber-600 font-black text-sm md:text-base shadow-inner">
                            🏆 得分 <span id="score-display" class="text-yellow-300 text-lg md:text-2xl">0</span>
                        </div>
                        <div id="combo-badge" class="hidden bg-gradient-to-r from-red-600 to-amber-500 text-white px-3 py-1 rounded-full border-2 border-yellow-200 font-black text-xs md:text-sm animate-bounce">
                            🔥 <span id="combo-count">0</span> 連擊
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="skipQuestion()" class="px-3 py-1 rounded-full bg-amber-800 hover:bg-amber-700 text-amber-100 text-xs font-bold border border-amber-500 shadow">
                            🔄 換題 (-3秒)
                        </button>
                        <div class="bg-[#451a03] text-amber-200 px-3.5 py-1 rounded-full border-2 border-amber-600 font-black text-sm md:text-base shadow-inner">
                            ⏱️ 時間 <span id="timer-display" class="text-emerald-400 text-lg md:text-2xl">90</span> 秒
                        </div>
                    </div>
                </div>

                <div class="bg-[#fef3c7] border-4 border-[#92400e] rounded-2xl p-3 md:p-5 text-center shadow-inner min-h-[115px] flex flex-col items-center justify-center">
                    <div class="w-full flex justify-between text-xs font-bold text-amber-800 mb-1">
                        <span id="q-topic-tag" class="bg-amber-200 border border-amber-500 px-2.5 py-0.5 rounded-full">📌 單元</span>
                        <span id="q-counter-tag">第 1 題</span>
                    </div>
                    <div id="q-text" class="text-lg md:text-2xl font-black text-slate-900 tracking-wide leading-snug my-1">載入中...</div>
                    <div id="q-img-wrapper" class="hidden my-2 max-h-44 rounded-xl border-2 border-amber-700 bg-white p-1 shadow">
                        <img id="q-img-el" src="" class="max-h-40 w-auto object-contain mx-auto" />
                    </div>
                    <div id="q-feedback" class="text-xs md:text-sm font-black text-rose-600 min-h-[20px] mt-1"></div>
                </div>
            </div>
            
            <div id="holes-grid" class="w-full grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-6 md:gap-x-8 md:gap-y-8 my-auto py-4 px-2 md:px-8">
                <!-- JS 動態生成地洞 -->
            </div>
        </section>
    </main>

    <!-- 結算彈窗 -->
    <div id="gameover-modal" class="fixed inset-0 bg-black/75 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#fef9c3] border-[6px] border-[#92400e] rounded-3xl max-w-xl w-full p-5 md:p-7 shadow-2xl max-h-[92vh] overflow-y-auto custom-scroll text-center">
            <div class="text-5xl mb-1">🎉🐹🏆</div>
            <h2 id="gameover-title" class="text-2xl md:text-3xl font-black text-amber-950">挑戰結算！</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 my-4 bg-amber-100 p-3 rounded-2xl border-2 border-amber-500">
                <div><span class="text-xs font-bold block">總得分</span><span id="final-score" class="text-2xl font-black text-rose-600">0</span></div>
                <div class="border-l border-amber-300"><span class="text-xs font-bold block">對/錯</span><span class="text-lg font-black"><span id="final-correct" class="text-emerald-700">0</span> / <span id="final-wrong" class="text-rose-600">0</span></span></div>
                <div class="border-l border-amber-300"><span class="text-xs font-bold block">耗時</span><span id="final-time" class="text-lg font-black text-indigo-800">90秒</span></div>
                <div class="border-l border-amber-300"><span class="text-xs font-bold block">本機最高</span><span id="final-best" class="text-2xl font-black text-amber-900">0</span></div>
            </div>
            <div class="bg-white border-2 border-amber-600 rounded-2xl p-3.5 mb-4 text-left">
                <label class="text-xs md:text-sm font-black text-amber-950 block mb-2">🏆 登記至雲端英雄榜：</label>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="player-name-input" placeholder="輸入姓名或座號..." class="flex-1 bg-amber-50 border-2 border-amber-500 rounded-xl px-3 py-2 text-sm font-black" />
                    <button onclick="submitScoreToCloud()" class="px-5 py-2 rounded-xl bg-amber-500 text-amber-950 font-black text-sm border-2 border-amber-700 shadow">送出成績</button>
                </div>
            </div>
            <div class="bg-amber-100/90 border-2 border-amber-500 rounded-2xl p-3.5 mb-5 text-left">
                <div class="flex justify-between mb-2">
                    <span class="text-xs md:text-sm font-black text-amber-950">📝 錯題回顧：</span>
                    <button id="btn-download-wrong" onclick="downloadWrongQuestionsTxt()" class="px-3 py-1 rounded-lg bg-emerald-700 text-white font-bold text-xs shadow">📥 下載錯題本 (.txt)</button>
                </div>
                <div id="wrong-list-box" class="max-h-36 overflow-y-auto custom-scroll space-y-1.5 text-xs"></div>
            </div>
            <div class="flex justify-center gap-3">
                <button onclick="startGame()" class="px-6 py-2.5 rounded-full bg-emerald-600 text-white font-black text-sm border-2 border-emerald-900 shadow">🔄 再玩一局</button>
                <button onclick="backToMenu()" class="px-6 py-2.5 rounded-full bg-slate-700 text-white font-black text-sm border-2 border-slate-900 shadow">⚙️ 主選單</button>
            </div>
        </div>
    </div>

    <!-- 題庫與音效等腳本 -->
    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfgpPB0_ABIlv2IAvoMGtss4-BVZ390ywr5DTpTNj5jP_BLu8lh5820csHjlaRCNLdLQ/exec';
        const ADMIN_PASSWORD = 'LKJHMATH';
        
        let selectedGrade = 7, selectedSemester = 1, selectedExam = 1, focusIndex = 0;
        let selectedBankMode = 'builtin', selectedPlayMode = 'timed', soundEnabled = true;
        
        let score = 0, combo = 0, isFever = false, timeLeft = 90;
        let correctCount = 0, wrongCount = 0, questionCount = 0;
        let gameTimerInterval, moleSpawnTimeout, feverTimeout;
        let isPlaying = false, currentQuestion = null;
        
        let customQuestionsBank = [], studentWrongBookBank = [], wrongQuestionsLog = [];
        let practiceQueue = [], timedRetryQueue = [];
        let activeHolesState = [null, null, null, null, null, null];

        // 各年級段考詳盡知識點
        const SCOPE_DESCRIPTIONS = {
            '1_1_1': '10以內的數、比長短與高矮、順序與第幾',
            '1_1_2': '分與合、10以內的加法與減法應用',
            '1_1_3': '30以內的數、認識立體圖形、認識時鐘',
            '1_2_1': '50以內的數、18以內的進位加法、退位減法',
            '1_2_2': '100以內的數、認識錢幣',
            '1_2_3': '二位數不進位加減、幾月幾日星期幾',
            '2_1_1': '200以內的數、二位數直式加減進退位',
            '2_1_2': '認識公分與公尺、容量與重量比較',
            '2_1_3': '2/4/5/8的乘法表與應用',
            '2_2_1': '1000以內的數、三位數加減法、3/6/7/9的乘法',
            '2_2_2': '認識角與平面圖形、年月與經過時間',
            '2_2_3': '兩步驟加減乘問題、分裝與平分',
            '3_1_1': '10000以內的數、四位數加減估算、毫米公分換算',
            '3_1_2': '二三位數乘以一位數、角與正方形長方形性質',

        function playTone(type) {
            if (!soundEnabled || !audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.exponentialRampToValueAtTime(1046.5, now + 0.22);
                gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.start(now); osc.stop(now + 0.28);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, now); osc.frequency.linearRampToValueAtTime(130, now + 0.25);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
                osc.start(now); osc.stop(now + 0.28);
            } else if (type === 'clock') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(660, now); osc.frequency.setValueAtTime(1320, now + 0.16);
                gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'bomb') {
                osc.type = 'square'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(45, now + 0.38);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // 工具函數
        const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const choice = (arr) => arr[randInt(0, arr.length - 1)];
        const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
        const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b) { [a, b] = [b, a%b]; } return a || 1; };
        
        function makeNumericDistractors(correctVal, step = 1, allowNegative = false) {
            const set = new Set();
            for(let c of [correctVal+step, correctVal-step, correctVal+step*2, correctVal-step*2, correctVal+10, correctVal-10]) {
                if(!allowNegative && c < 0) continue;
                if(c !== correctVal) set.add(String(c));
            }
            while(set.size < 3) {
                let v = correctVal + randInt(1, 9) * (Math.random()<0.5?1:-1);
                if(!allowNegative && v < 0) v = Math.abs(v);
                if(v !== correctVal) set.add(String(v));
            }
            return Array.from(set).slice(0,3);
        }

        // =========================================================================
        // 超強大 108課綱 數學出題引擎 (支援 focusIndex 精準打擊)
        // =========================================================================
        function createMathQuestion(g, s, e, focusIdx = 0) {
            let q = '', a = '', d = [], topic = '';
            const key = `${g}_${s}_${e}`;
            const desc = SCOPE_DESCRIPTIONS[key] || '';
            const topics = desc.split(/[、，]/).map(t => t.trim());
            
            // 決定要考哪個子單元 (sub從1開始)
            let maxSub = topics.length || 1;
            let sub = focusIdx > 0 && focusIdx <= maxSub ? focusIdx : randInt(1, maxSub);
            topic = topics[sub - 1] || '綜合觀念';

            switch(key) {
                // ---------------- 國一 ----------------
                case '7_1_1': {
                    if (sub === 1) { // 正負數
                        const x = randInt(-15, 15), y = randInt(-15, -1);
                        q = `計算：(${x}) - (${y}) = ?`; a = `${x - y}`; d = [`${x + y}`, `${-(x - y)}`, `${x - y + 4}`];
                    } else if (sub === 2) { // 絕對值
                        const x = randInt(-25, -4), y = randInt(3, 15);
                        q = `計算：|${x}| - ${y} = ?`; a = `${Math.abs(x) - y}`; d = [`${x - y}`, `${Math.abs(x) + y}`, `${-Math.abs(x) - y}`];
                    } else { // 指數律
                        const m = randInt(2, 5), n = randInt(2, 4);
                        q = `化簡：2^${m} × 2^${n} = ?`; a = `2^${m + n}`; d = [`4^${m + n}`, `2^${m * n}`, `2^${Math.abs(m - n)}`];
                    }
                    break;
                }
                case '7_1_3': { // 修正一元一次方程式的邏輯
                    if (sub === 1) { // 代數式化簡
                        const aC = randInt(2, 5), bC = randInt(1, 6), cC = randInt(2, 4);
                        q = `化簡：${aC}(x + ${bC}) + ${cC}x = ?`; a = `${aC+cC}x + ${aC*bC}`; d = [`${aC+cC}x + ${bC}`, `${aC*cC}x + ${aC*bC}`, `${aC+cC}x`];
                    } else { // 方程式解法
                        const xVal = randInt(-6, 9);
                        const aC = randInt(2, 6);
                        let cC = randInt(2, 6); while(cC === aC) cC = randInt(2, 6);
                        const bC = randInt(1, 12);
                        // ax - b = cx + d => d = (a-c)x - b
                        const dC = (aC - cC) * xVal - bC;
                        const signB = bC >= 0 ? `- ${bC}` : `+ ${Math.abs(bC)}`;
                        const signD = dC >= 0 ? `+ ${dC}` : `- ${Math.abs(dC)}`;
                        q = `解方程式：${aC}x ${signB} = ${cC}x ${signD}，則 x = ?`;
                        a = `${xVal}`; d = makeNumericDistractors(xVal, 1, true);
                    }
                    break;
                }
                // ---------------- 國二 ----------------
                case '8_1_2': { // 修正平方根陷阱與擴充畢氏定理
                    if (sub === 1) { // 平方根
                        const type = randInt(1, 4);
                        if (type === 1) { q = `化簡根式：√64 = ?`; a = `8`; d = ['±8', '4', '32']; }
                        else if (type === 2) { q = `求平方根：64 的「平方根」為何？`; a = `±8`; d = ['8', '-8', '4']; }
                        else if (type === 3) { q = `求正平方根：64 的「正平方根」為何？`; a = `8`; d = ['±8', '-8', '32']; }
                        else { q = `觀念陷阱題：「√81」的平方根為何？`; a = `±3`; d = ['±9', '9', '3']; }
                    } else if (sub === 2) { // 畢氏定理 12 組
                        const sets = [[3,4,5], [5,12,13], [6,8,10], [8,15,17], [7,24,25], [9,12,15], [10,24,26], [20,21,29], [9,40,41], [12,35,37]];
                        const [l1, l2, hyp] = choice(sets);
                        q = `直角三角形兩股長為 ${l1} 與 ${l2}，斜邊長為何？`; a = `${hyp}`; d = [`${l1+l2}`, `${hyp+2}`, `${hyp-1}`];
                    } else { // 因式分解
                        const r1 = randInt(2, 5), r2 = randInt(3, 6);
                        q = `因式分解 x² + ${r1+r2}x + ${r1*r2} = ?`; a = `(x+${r1})(x+${r2})`; d = [`(x-${r1})(x-${r2})`, `(x+${r1*r2})(x+1)`, `x(x+${r1+r2})`];
                    }
                    break;
                }
                // ---------------- 國三 ----------------
                case '9_1_2': {
                    if (sub === 1) { // 點線圓
                        const sets = [[3,4,5], [5,12,13], [6,8,10]]; const [r, tang, op] = choice(sets);
                        q = `自圓外一點P作切線交於A，半徑OA=${r}，OP=${op}，切線段PA=?`; a = `${tang}`; d = [`${op-r}`, `${tang*2}`, `${r+op}`];
                    } else if (sub === 2) { // 弦心距
                        const [r, dist, chord] = choice([[5,3,8], [10,6,16], [13,5,24]]);
                        q = `圓半徑為 ${r}，某弦弦心距為 ${dist}，此弦長為多少？`; a = `${chord}`; d = [`${chord/2}`, `${r+dist}`, `${chord+4}`];
                    } else { // 圓心角圓周角
                        const arc = randInt(30, 80) * 2;
                        q = `圓中某弧度為 ${arc}°，其所對「圓周角」為幾度？`; a = `${arc/2}°`; d = [`${arc}°`, `${arc*2}°`, `${180-arc}°`];
                    }
                    break;
                }
                case '9_2_1': {
                    if (sub === 1) { // 頂點
                        const h = randInt(1, 5), k = randInt(-5, 5);
                        q = `二次函數 y = 2(x - ${h})² ${k>=0?'+':'-'} ${Math.abs(k)} 的頂點為何？`; a = `(${h}, ${k})`; d = [`(${-h}, ${k})`, `(${h}, ${-k})`, `(${-h}, ${-k})`];
                    } else { // 極值
                        const h = randInt(1, 6), k = randInt(2, 10);
                        q = `二次函數 y = -(x - ${h})² + ${k} 的最大值為何？`; a = `${k}`; d = [`${h}`, `${-k}`, `${h+k}`];
                    }
                    break;
                }
                // （為精簡展示，1~6年級與未列出者採用通用代數與四則運算防呆邏輯）
                default: {
                    const x = randInt(5, 15), y = randInt(5, 15);
                    q = `計算：${x} + ${y} = ?`; a = `${x + y}`; d = makeNumericDistractors(x + y, 1);
                }
            }
            return { topic, q, a, distractors: shuffle([a, ...d.slice(0,3)]) };
        }

        function nextQuestion() {
            if (!isPlaying) return;

            if (selectedBankMode === 'wrongbook') {
                const pick = choice(studentWrongBookBank);
                currentQuestion = { topic: '📝 錯題特訓', q: pick.q, a: pick.a, distractors: pick.distractors };
            } else {
                currentQuestion = createMathQuestion(selectedGrade, selectedSemester, selectedExam, focusIndex);
            }

            document.getElementById('q-topic-tag').innerText = `📌 ${currentQuestion.topic}`;
            document.getElementById('q-text').innerText = currentQuestion.q;
            document.getElementById('q-feedback').innerText = '';
            spawnMolesWave();
        }

        function skipQuestion() {
            if (!isPlaying) return;
            timeLeft = Math.max(0, timeLeft - 3); // 換題扣 3 秒
            document.getElementById('timer-display').innerText = timeLeft;
            document.getElementById('q-feedback').innerText = '⏭️ 換一題 (扣 3 秒)';
            nextQuestion();
        }

        function spawnMolesWave() {
            clearTimeout(moleSpawnTimeout);
            if (!isPlaying || !currentQuestion) return;
            
            for(let i=0; i<6; i++) {
                activeHolesState[i] = null;
                document.getElementById(`mole-${i}`).classList.remove('up', 'bonked');
            }

            setTimeout(() => {
                if(!isPlaying) return;
                const holeIdxs = shuffle([0,1,2,3,4,5]);
                const opts = [
                    { text: currentQuestion.a, isCorrect: true, type: 'answer' },
                    ...currentQuestion.distractors.filter(x => x!==currentQuestion.a).slice(0,3).map(d => ({ text: d, isCorrect: false, type: 'answer' }))
                ];

                for(let i=0; i<4; i++) {
                    const h = holeIdxs[i]; activeHolesState[h] = opts[i];
                    document.getElementById(`mole-svg-${h}`).innerHTML = renderMoleSVG(opts[i].text, 'answer');
                    document.getElementById(`mole-${h}`).classList.add('up');
                }

                // 30% 出現道具
                if(Math.random() < 0.3) {
                    const h = holeIdxs[4];
                    const isClock = Math.random() < 0.5;
                    const item = isClock ? { text: '⏳ +10秒', isCorrect: false, type: 'clock' } : { text: '💣 勿敲', isCorrect: false, type: 'bomb' };
                    activeHolesState[h] = item;
                    document.getElementById(`mole-svg-${h}`).innerHTML = renderMoleSVG(item.text, item.type);
                    document.getElementById(`mole-${h}`).classList.add('up');
                }

                let stayMs = isFever ? 2000 : 3500;
                moleSpawnTimeout = setTimeout(() => spawnMolesWave(), stayMs);
            }, 300);
        }

        function whackMole(idx) {
            if(!isPlaying || !activeHolesState[idx]) return;
            const state = activeHolesState[idx];
            activeHolesState[idx] = null;

            const el = document.getElementById(`mole-${idx}`);
            el.classList.remove('up'); el.classList.add('bonked');
            const fx = document.getElementById(`fx-${idx}`);
            fx.innerHTML = `<div class="text-3xl animate-ping absolute -top-10">🔨</div>`;
            setTimeout(()=>fx.innerHTML='', 400);

            if(state.type === 'clock') {
                playTone('clock'); timeLeft += 10; document.getElementById('timer-display').innerText = timeLeft;
                document.getElementById('q-feedback').innerText = '⏳ 時間 +10 秒！'; return;
            }
            if(state.type === 'bomb') {
                playTone('bomb'); timeLeft = Math.max(0, timeLeft-5); score = Math.max(0, score-15); combo = 0; isFever = false;
                document.getElementById('game-stage').classList.remove('fever-active');
                updateScoreUI(); document.getElementById('q-feedback').innerText = '💥 扣 15 分並扣 5 秒！'; return;
            }

            if(state.isCorrect) {
                playTone('correct'); correctCount++; combo++;
                if(combo >= 5 && !isFever) {
                    isFever = true; document.getElementById('game-stage').classList.add('fever-active');
                    clearTimeout(feverTimeout); feverTimeout = setTimeout(() => { isFever=false; document.getElementById('game-stage').classList.remove('fever-active'); }, 10000);
                }
                const pts = (10 + (combo>=3?5:0)) * (isFever?2:1);
                score += pts; updateScoreUI();
                document.getElementById('q-feedback').innerText = `✅ 答對了 +${pts} 分！`;
                clearTimeout(moleSpawnTimeout); setTimeout(()=>nextQuestion(), 400);
            } else {
                playTone('wrong'); wrongCount++; combo = 0; score = Math.max(0, score-5); isFever = false;
                document.getElementById('game-stage').classList.remove('fever-active');
                updateScoreUI();
                if(!wrongQuestionsLog.some(w => w.q === currentQuestion.q)) {
                    wrongQuestionsLog.push({ q: currentQuestion.q, correct: currentQuestion.a, wrong: state.text });
                }
                document.getElementById('q-feedback').innerText = '⚠️ 敲錯囉！再找找看！';
            }
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = score;
            const badge = document.getElementById('combo-badge');
            if(combo >= 2) { badge.classList.remove('hidden'); document.getElementById('combo-count').innerText = combo; }
            else { badge.classList.add('hidden'); }
        }

        function endGame() {
            isPlaying = false; clearInterval(gameTimerInterval); clearTimeout(moleSpawnTimeout);
            document.getElementById('play-screen').classList.add('hidden');
            document.getElementById('gameover-modal').classList.remove('hidden');
            document.getElementById('gameover-modal').classList.add('flex');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = correctCount;
            document.getElementById('final-wrong').innerText = wrongCount;

            const wBox = document.getElementById('wrong-list-box');
            if(wrongQuestionsLog.length===0) wBox.innerHTML = '<p class="text-center">✨ 本局全對！</p>';
            else wBox.innerHTML = wrongQuestionsLog.map((w,i) => `<div>${i+1}. ${w.q} <br><span class="text-emerald-700">✅ ${w.correct}</span> | <span class="text-rose-600">❌ ${w.wrong}</span></div>`).join('<hr class="my-1 border-amber-300">');
        }

        function backToMenu() {
            document.getElementById('gameover-modal').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        // =========================================================================
        // 錯題本匯出與匯入功能
        // =========================================================================
        function downloadWrongQuestionsTxt() {
            if(wrongQuestionsLog.length===0) return;
            const lines = ['=== 數學打地鼠 錯題本 ===', `得分：${score} 分`, '----------------'];
            wrongQuestionsLog.forEach((w,i) => { lines.push(`第 ${i+1} 題：${w.q}`); lines.push(`  ✅ 正確答案：${w.correct}`); lines.push(`  ❌ 當時誤敲：${w.wrong}\n`); });
            const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '我的錯題本.txt'; a.click();
        }

        function importStudentWrongBookTxt(e) {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const lines = ev.target.result.split(/\r?\n/);
                const imported = []; let curQ = null, curA = null;
                lines.forEach(l => {
                    const mQ = l.match(/^第\s*\d+\s*題[:：]\s*(.+)$/);
                    const mA = l.match(/✅\s*正確答案[:：]\s*(.+)$/);
                    if(mQ) { if(curQ && curA) { imported.push({q:curQ, a:curA, distractors:makeNumericDistractors(parseFloat(curA)||randInt(10,50))}); } curQ=mQ[1].trim(); curA=null; }
                    else if(mA) { curA=mA[1].trim(); }
                });
                if(curQ && curA) imported.push({q:curQ, a:curA, distractors:makeNumericDistractors(parseFloat(curA)||randInt(10,50))});
                if(imported.length > 0) { studentWrongBookBank = imported; document.getElementById('wrongbook-panel-info').innerText = `✅ 已載入 ${imported.length} 題錯題`; selectBankMode('wrongbook'); }
            };
            reader.readAsText(file, 'UTF-8'); e.target.value = '';
        }
    </script>
