<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數學打地鼠大挑戰 - 108課綱互動解題遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Fredoka:wght@600;700&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
            background-color: #1e3a1e;
        }

        .math-font {
            font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
        }

        /* 藍天草地漸層背景 */
        .meadow-sky {
            background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 55%, #86efac 55%, #22c55e 75%, #15803d 100%);
        }

        /* 木質立體看板樣式 */
        .wood-board {
            background: linear-gradient(180deg, #d97706 0%, #b45309 50%, #92400e 100%);
            border: 5px solid #451a03;
            box-shadow: 0 10px 0 #451a03, 0 15px 25px rgba(0,0,0,0.45), inset 0 3px 0 rgba(255,255,255,0.35);
        }

        .wood-inner {
            background: linear-gradient(180deg, #fef3c7 0%, #fde68a 100%);
            border: 3px solid #78350f;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.15);
        }

        /* 傳統街機立體地洞與土堆 */
        .dirt-mound {
            background: radial-gradient(ellipse at 50% 35%, #9a5b32 0%, #713f12 65%, #422006 100%);
            box-shadow: 0 10px 15px rgba(0,0,0,0.45), inset 0 3px 5px rgba(255,255,255,0.25);
            border: 3px solid #3b1905;
        }

        .hole-pit {
            background: radial-gradient(ellipse at 50% 60%, #090502 0%, #1c0f07 70%, #361d0d 100%);
            box-shadow: inset 0 12px 20px rgba(0,0,0,0.95), inset 0 -3px 6px rgba(255,255,255,0.08);
        }

        /* 地鼠鑽出遮罩容器：讓地鼠從洞口底部往上冒出 */
        .mole-mask {
            clip-path: inset(-130px -30px 0px -30px);
        }

        /* 地鼠上下移動過渡 */
        .mole-wrapper {
            transition: transform 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(105%);
        }
        .mole-wrapper.up {
            transform: translateY(4%);
        }
        .mole-wrapper.hit-correct {
            animation: moleSquishCorrect 0.65s ease-out forwards;
        }
        .mole-wrapper.hit-wrong {
            animation: moleSquishWrong 0.55s ease-in forwards;
        }

        @keyframes moleSquishCorrect {
            0% { transform: translateY(4%) scale(1, 1); }
            25% { transform: translateY(18%) scale(1.3, 0.65); }
            55% { transform: translateY(-8%) scale(0.95, 1.08) rotate(-5deg); }
            80% { transform: translateY(-4%) scale(1, 1) rotate(5deg); opacity: 1; }
            100% { transform: translateY(105%) scale(0.8); opacity: 0; }
        }

        @keyframes moleSquishWrong {
            0% { transform: translateY(4%) scale(1, 1); }
            20% { transform: translateY(22%) scale(1.25, 0.75); }
            50% { transform: translateX(-8px) translateY(15%); }
            75% { transform: translateX(8px) translateY(35%); }
            100% { transform: translateY(105%); }
        }

        /* 充氣木槌下砸動畫 */
        @keyframes hammerStrike {
            0% { transform: translate(35px, -65px) rotate(45deg) scale(0.85); opacity: 0; }
            20% { transform: translate(20px, -50px) rotate(50deg) scale(1); opacity: 1; }
            50% { transform: translate(-12px, 10px) rotate(-25deg) scale(1.15, 0.85); opacity: 1; }
            75% { transform: translate(-5px, -5px) rotate(-12deg) scale(1); opacity: 1; }
            100% { transform: translate(20px, -45px) rotate(25deg) scale(0.9); opacity: 0; }
        }
        .hammer-anim {
            animation: hammerStrike 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            transform-origin: 80% 85%;
        }

        /* 畫面震動特效 */
        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 5px); }
            40% { transform: translate(6px, -5px); }
            60% { transform: translate(-4px, 3px); }
            80% { transform: translate(4px, -3px); }
        }
        .shake-active {
            animation: screenShake 0.32s ease-in-out;
        }

        /* 飄浮加扣分特效 */
        @keyframes floatScore {
            0% { transform: translate(-50%, 10px) scale(0.5); opacity: 0; }
            30% { transform: translate(-50%, -18px) scale(1.2); opacity: 1; }
            80% { transform: translate(-50%, -38px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -55px) scale(0.9); opacity: 0; }
        }
        .score-float {
            animation: floatScore 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 雲朵緩慢飄動 */
        @keyframes floatCloud {
            0% { transform: translateX(-10%); }
            50% { transform: translateX(10%); }
            100% { transform: translateX(-10%); }
        }
        .cloud-anim {
            animation: floatCloud 18s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between meadow-sky relative overflow-x-hidden">

    <!-- 裝飾背景：太陽與雲朵 -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
        <!-- 太陽 -->
        <div class="absolute top-6 right-8 w-20 h-20 md:w-28 md:h-28 rounded-full bg-yellow-300 shadow-[0_0_50px_#fef08a] border-4 border-yellow-100 flex items-center justify-center text-3xl md:text-5xl">
            ☀️
        </div>
        <!-- 雲朵 -->
        <div class="cloud-anim absolute top-8 left-[8%] opacity-85 text-6xl md:text-7xl select-none">☁️</div>
        <div class="cloud-anim absolute top-20 left-[55%] opacity-75 text-5xl md:text-6xl select-none" style="animation-delay: -7s;">☁️</div>
        <!-- 遠景翠綠山丘 -->
        <div class="absolute top-[46%] -left-[10%] w-[70%] h-36 bg-emerald-500 rounded-[100%] border-t-4 border-emerald-300/60 shadow-inner"></div>
        <div class="absolute top-[44%] -right-[10%] w-[75%] h-44 bg-green-500 rounded-[100%] border-t-4 border-green-300/60 shadow-inner"></div>
    </div>

    <!-- 頂部導覽列 -->
    <header class="relative z-20 bg-amber-950/90 border-b-4 border-amber-800 text-amber-100 px-4 py-2.5 shadow-lg flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
            <span class="text-2xl md:text-3xl">🐹</span>
            <div>
                <h1 class="text-lg md:text-xl font-black tracking-wide text-yellow-300 drop-shadow">數學打地鼠大挑戰</h1>
                <p id="current-scope-badge" class="text-xs text-amber-200/90">請選擇年級、學期與考試範圍</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="window.openLeaderboard()" class="px-3 py-1.5 rounded-xl bg-yellow-500 hover:bg-yellow-400 border-2 border-yellow-600 text-amber-950 text-xs md:text-sm font-black transition shadow">
                🏆 排行榜
            </button>
            <button id="btn-sound" onclick="toggleMute()" class="px-3 py-1.5 rounded-xl bg-amber-800 hover:bg-amber-700 border-2 border-amber-600 text-xs md:text-sm font-bold transition shadow">
                🔊 音效: 開
            </button>
            <button id="btn-fullscreen" onclick="toggleFullscreen()" class="px-3 py-1.5 rounded-xl bg-indigo-700 hover:bg-indigo-600 border-2 border-indigo-400 text-white text-xs md:text-sm font-bold transition shadow">
                ⛶ 全螢幕
            </button>
            <button id="btn-back-menu" onclick="returnToMenu()" class="hidden px-3 py-1.5 rounded-xl bg-rose-700 hover:bg-rose-600 border-2 border-rose-400 text-white text-xs md:text-sm font-bold transition shadow">
                ⚙️ 重選範圍
            </button>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-3 py-4 w-full max-w-5xl mx-auto">

        <!-- ================= 畫面一：開始選單（年級/學期/段考範圍設定） ================= -->
        <section id="menu-screen" class="w-full max-w-3xl wood-board rounded-3xl p-4 md:p-6 transition-all">
            <div class="wood-inner rounded-2xl p-5 md:p-7 text-amber-950">
                <div class="text-center mb-5">
                    <div class="inline-block bg-amber-500/20 border-2 border-amber-600 rounded-full px-4 py-1 text-xs md:text-sm font-extrabold text-amber-900 mb-2">
                        🎯 108 課綱國小～國中數學互動題庫
                    </div>
                    <h2 class="text-2xl md:text-3xl font-black text-amber-950">請選擇挑戰程度與評量範圍</h2>
                    <p class="text-xs md:text-sm text-amber-800 mt-1">地鼠會舉著不同答案牌從地洞冒出，看準題目敲中「正確答案」得分，敲錯會扣分喔！</p>
                </div>

                <!-- 步驟 1：選擇年級 (小一 ~ 國三) -->
                <div class="mb-5">
                    <label class="block text-sm md:text-base font-black text-amber-900 mb-2 flex items-center gap-1.5">
                        <span class="bg-amber-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">1</span>
                        選擇年級程度（小一 ～ 國三）：
                    </label>
                    <div class="grid grid-cols-3 sm:grid-cols-6 gap-2 mb-2" id="grade-primary-group">
                        <!-- 小一至小六 -->
                        <button onclick="selectGrade(1)" id="grade-btn-1" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小一</button>
                        <button onclick="selectGrade(2)" id="grade-btn-2" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小二</button>
                        <button onclick="selectGrade(3)" id="grade-btn-3" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小三</button>
                        <button onclick="selectGrade(4)" id="grade-btn-4" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小四</button>
                        <button onclick="selectGrade(5)" id="grade-btn-5" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小五</button>
                        <button onclick="selectGrade(6)" id="grade-btn-6" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">小六</button>
                    </div>
                    <div class="grid grid-cols-3 gap-2" id="grade-junior-group">
                        <!-- 國一至國三 -->
                        <button onclick="selectGrade(7)" id="grade-btn-7" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">國一 (七年級)</button>
                        <button onclick="selectGrade(8)" id="grade-btn-8" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">國二 (八年級)</button>
                        <button onclick="selectGrade(9)" id="grade-btn-9" class="grade-btn py-2.5 px-2 rounded-xl font-black text-sm md:text-base border-2 transition-all">國三 (九年級)</button>
                    </div>
                </div>

                <!-- 步驟 2：選擇學期 (上學期 / 下學期) -->
                <div class="mb-5">
                    <label class="block text-sm md:text-base font-black text-amber-900 mb-2 flex items-center gap-1.5">
                        <span class="bg-amber-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">2</span>
                        選擇學期：
                    </label>
                    <div class="flex flex-wrap gap-2">
                        <button onclick="selectTerm(1)" id="term-btn-1" class="py-2.5 px-4 rounded-xl font-black text-sm md:text-base border-2 transition-all">🍂 上學期</button>
                        <button onclick="selectTerm(2)" id="term-btn-2" class="py-2.5 px-4 rounded-xl font-black text-sm md:text-base border-2 transition-all">🌱 下學期</button>
                    </div>
                </div>

                <!-- 步驟 3：選擇考試範圍 (國小期中/期末，國中包含全學期/年級/三年) -->
                <div class="mb-5">
                    <label class="block text-sm md:text-base font-black text-amber-900 mb-2 flex items-center gap-1.5">
                        <span class="bg-amber-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">3</span>
                        選擇評量/段考範圍：
                    </label>
                    <div id="exam-buttons-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
                        <!-- 由 JS 根據國小/國中動態渲染 -->
                    </div>
                </div>

                <!-- 步驟 4：單一題型練習 (可選) -->
                <div class="mb-5">
                    <label class="block text-sm md:text-base font-black text-amber-900 mb-2 flex items-center gap-1.5">
                        <span class="bg-amber-800 text-white w-6 h-6 rounded-full inline-flex items-center justify-center text-xs">4</span>
                        針對個別重點練習 (單一題型)：
                    </label>
                    <div id="topic-buttons-container" class="flex flex-wrap gap-2">
                        <!-- 由 JS 動態渲染單元按鈕 -->
                    </div>
                </div>

                <!-- 步驟 5：選擇地鼠浮現速度與時間 -->
                <div class="mb-5 bg-amber-200/60 border-2 border-amber-700/40 rounded-2xl p-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <div>
                        <div class="text-xs font-bold text-amber-800">📚 本範圍考查單元重點：</div>
                        <div id="scope-topic-desc" class="text-sm md:text-base font-black text-emerald-900 mt-0.5">
                            10以內的數、比長短、10以內的加減
                        </div>
                    </div>
                    <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                        <span class="text-xs font-bold text-amber-900">地鼠速度：</span>
                        <select id="speed-select" class="bg-white border-2 border-amber-700 rounded-xl px-2.5 py-1 text-xs md:text-sm font-bold text-amber-950 focus:outline-none">
                            <option value="slow">🐢 輕鬆思考 (4.5秒)</option>
                            <option value="normal" selected>🐹 標準速度 (3.5秒)</option>
                            <option value="fast">⚡ 刺激快打 (2.5秒)</option>
                        </select>
                    </div>
                </div>

                <!-- 開始按鈕 -->
                <div class="text-center">
                    <button onclick="startGame()" class="w-full sm:w-auto px-10 py-3.5 rounded-full bg-gradient-to-b from-emerald-500 to-green-700 hover:from-emerald-400 hover:to-green-600 text-white font-black text-xl md:text-2xl border-4 border-green-950 shadow-[0_6px_0_#052e16] active:translate-y-1 active:shadow-none transition-all cursor-pointer">
                        🔨 開始打地鼠解題！
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= 畫面二：遊戲主舞台 ================= -->
        <section id="game-screen" class="hidden w-full flex-col items-center">
            
            <!-- 頂部資訊與數學題目大看板 -->
            <div id="question-board" class="w-full max-w-3xl wood-board rounded-3xl p-3 md:p-4 mb-4 md:mb-6 relative">
                <!-- 狀態列：分數、連擊、時間 -->
                <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5 px-2 text-white">
                    <div class="flex items-center gap-3">
                        <div class="bg-amber-950/80 border-2 border-amber-500 rounded-2xl px-3.5 py-1 flex items-center gap-1.5 shadow">
                            <span class="text-lg">🏆</span>
                            <span class="text-xs text-amber-200 font-bold">得分</span>
                            <span id="score-display" class="text-xl md:text-2xl font-black text-yellow-300 math-font">0</span>
                        </div>
                        <div id="combo-badge" class="hidden bg-orange-600 border-2 border-yellow-300 rounded-2xl px-3 py-1 items-center gap-1 shadow animate-bounce">
                            <span class="text-sm font-black text-white">🔥 <span id="combo-display">0</span> 連擊!</span>
                        </div>
                    </div>

                    <!-- 換題按鈕 (避免學生卡死) -->
                    <div class="flex items-center gap-2">
                        <button onclick="skipQuestion()" class="px-3 py-1 rounded-xl bg-amber-800 hover:bg-amber-700 border border-amber-400 text-amber-100 text-xs font-bold transition shadow">
                            🔄 換一題
                        </button>
                        <div class="bg-amber-950/80 border-2 border-amber-500 rounded-2xl px-3.5 py-1 flex items-center gap-1.5 shadow">
                            <span class="text-lg">⏱️</span>
                            <span class="text-xs text-amber-200 font-bold">時間</span>
                            <span id="timer-display" class="text-xl md:text-2xl font-black text-emerald-300 math-font">90</span>
                            <span class="text-xs text-amber-200">秒</span>
                        </div>
                    </div>
                </div>

                <!-- 題目黑板/羊皮紙顯示區 -->
                <div class="wood-inner rounded-2xl px-4 py-4 md:py-5 text-center relative overflow-hidden">
                    <div class="flex items-center justify-between text-xs font-bold text-amber-800/80 mb-1 px-1">
                        <span id="question-unit-tag" class="bg-amber-300/70 px-2.5 py-0.5 rounded-full border border-amber-600/40">單元名稱</span>
                        <span id="question-counter-tag">第 1 題</span>
                    </div>
                    <div id="question-text" class="text-2xl sm:text-3xl md:text-4xl font-black text-slate-900 tracking-wide leading-snug math-font py-1">
                        題目載入中...
                    </div>
                    <!-- 即時答題回饋橫幅 -->
                    <div id="feedback-banner" class="h-6 text-sm md:text-base font-extrabold text-emerald-700 transition-opacity opacity-0">
                        ✨ 太棒了！答對 +10 分！
                    </div>
                </div>
            </div>

            <!-- 6 個地洞草地舞台 (3x2 響應式網格) -->
            <div id="holes-stage" class="w-full max-w-4xl grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-8 md:gap-x-8 md:gap-y-10 pt-6 pb-4 px-2 sm:px-6">
                <!-- 由 JS 動態生成 6 個立體地洞與舉牌地鼠 -->
            </div>

        </section>

    </main>

    <!-- ================= 畫面三：結算與錯題回顧 Modal ================= -->
    <div id="result-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="w-full max-w-2xl wood-board rounded-3xl p-4 md:p-6 animate-pop max-h-[90vh] flex flex-col">
            <div class="wood-inner rounded-2xl p-5 md:p-6 text-amber-950 overflow-y-auto flex-grow">
                <div class="text-center border-b-2 border-amber-700/30 pb-4 mb-4">
                    <div class="text-5xl md:text-6xl mb-2">🎉🐹🏆</div>
                    <h2 class="text-2xl md:text-3xl font-black text-amber-950">時間到！挑戰結算</h2>
                    <p id="result-scope-title" class="text-sm font-bold text-amber-800 mt-1"></p>
                </div>

                <!-- 成績統計三格 -->
                <div class="grid grid-cols-3 gap-3 mb-5 text-center">
                    <div class="bg-amber-100 border-2 border-amber-600 rounded-2xl p-3 shadow-sm">
                        <div class="text-xs font-bold text-amber-800">最終總分</div>
                        <div id="final-score" class="text-2xl md:text-4xl font-black text-amber-600 math-font mt-1">0</div>
                    </div>
                    <div class="bg-emerald-100 border-2 border-emerald-600 rounded-2xl p-3 shadow-sm">
                        <div class="text-xs font-bold text-emerald-800">命中正確</div>
                        <div id="final-correct" class="text-2xl md:text-4xl font-black text-emerald-600 math-font mt-1">0</div>
                    </div>
                    <div class="bg-rose-100 border-2 border-rose-600 rounded-2xl p-3 shadow-sm">
                        <div class="text-xs font-bold text-rose-800">誤擊扣分</div>
                        <div id="final-wrong" class="text-2xl md:text-4xl font-black text-rose-600 math-font mt-1">0</div>
                    </div>
                </div>

                <!-- 登記成績至排行榜 -->
                <div id="submit-score-section" class="mb-5 bg-amber-100/60 p-3 rounded-xl border border-amber-300">
                    <label class="block text-sm md:text-base font-bold text-amber-900 mb-2">🏆 登記成績至排行榜：</label>
                    <div class="flex gap-2">
                        <input type="text" id="player-name" placeholder="請輸入您的姓名或暱稱" class="flex-grow px-3 py-2 rounded-lg border-2 border-amber-400 focus:outline-none focus:border-amber-600 text-amber-950 font-bold transition-all">
                        <button id="submit-score-btn" onclick="window.submitScoreAction()" class="px-4 py-2 bg-gradient-to-b from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-white rounded-lg font-bold transition shadow cursor-pointer whitespace-nowrap">
                            送出成績
                        </button>
                    </div>
                </div>

                <!-- 答題紀錄與解析列表 -->
                <div class="mb-5">
                    <h3 class="text-sm md:text-base font-black text-amber-950 mb-2 flex items-center gap-1.5">
                        <span>📝 本局解題回顧：</span>
                    </h3>
                    <div id="history-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                        <!-- 動態列出答對與答錯的題目與正解 -->
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                    <button onclick="startGame()" class="px-8 py-3 rounded-full bg-gradient-to-b from-emerald-500 to-green-700 hover:from-emerald-400 hover:to-green-600 text-white font-black text-lg border-4 border-green-950 shadow-[0_4px_0_#052e16] active:translate-y-1 transition cursor-pointer">
                        🔄 再玩一次同範圍
                    </button>

    <!-- Google Apps Script (GAS) 整合 (試算表排行榜) -->
    <script>
        // ======= 👇 請將下方的引號內容，替換成您的 GAS 網頁應用程式 URL 👇 =======
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyfgpPB0_ABIlv2IAvoMGtss4-BVZ390ywr5DTpTNj5jP_BLu8lh5820csHjlaRCNLdLQ/exec';
        // =========================================================================

        let allScores = [];

        // 全域函式：上傳成績
        window.submitScoreToCloud = async function(name) {
            const btn = document.getElementById('submit-score-btn');
            btn.disabled = true;
            btn.innerText = '送出中...';

            if(GAS_URL.includes('請替換')) {
                alert('⚠️ 尚未設定 Google Apps Script 網址！請老師先在 HTML 原始碼中填入您的 GAS URL。');
                btn.innerText = '無法連線伺服器';
                btn.disabled = false;
                return;
            }

            try {
                const payload = {
                    action: 'addScore',
                    name: name.trim(),
                    grade: window.selectedGrade,
                    score: window.score
                };
                
                // 傳送資料到 GAS (使用 POST，避免 CORS preflight)
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    btn.innerText = '已成功送出！';
                    btn.classList.replace('bg-amber-600', 'bg-emerald-600');
                    setTimeout(() => {
                        window.openLeaderboard();
                    }, 800);
                } else {
                    throw new Error('伺服器回傳錯誤');
                }
            } catch (e) {
                console.error("Save error", e);
                btn.innerText = '送出失敗，請重試';
                btn.disabled = false;
            }
        }

        // 全域函式：讀取排行榜
        window.fetchAndShowLeaderboard = async function(gradeFilter) {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '<div class="text-center py-8 font-bold text-amber-700 animate-pulse">📡 讀取雲端資料中...</div>';
            
            if(GAS_URL.includes('請替換')) {
                listEl.innerHTML = '<div class="text-center py-8 text-rose-600 font-bold">⚠️ 尚未設定連線，請先在程式碼中填入 GAS URL。</div>';
                return;
            }

            try {
                // 從 GAS 讀取資料
                const response = await fetch(GAS_URL + '?action=getLeaderboard');
                const result = await response.json();
                
                if (result.status === 'success') {
                    allScores = result.data;
                    window.renderLeaderboardUI(gradeFilter);
                } else {
                    throw new Error('伺服器回傳錯誤');
                }
            } catch(e) {
                console.error(e);
                listEl.innerHTML = '<div class="text-center py-8 text-rose-600 font-bold">讀取失敗，請檢查網址或稍後再試。</div>';
            }
        }

        // 全域函式：渲染排行榜畫面
        window.renderLeaderboardUI = function(grade) {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';
            
            // 在記憶體中篩選年級並由高到低排序
            const filtered = allScores.filter(s => parseInt(s.grade) === grade).sort((a, b) => b.score - a.score);
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="text-center py-8 text-amber-700 font-bold">目前該年級還沒有人挑戰，搶先成為第一名吧！</div>';
                return;
            }

            filtered.slice(0, 50).forEach((s, idx) => {
                const el = document.createElement('div');
                let bgClass = "bg-amber-50 border-amber-200";
                let rankStr = `<span class="font-black text-amber-800 w-6 text-center">${idx + 1}</span>`;
                
                if (idx === 0) { bgClass = "bg-yellow-100 border-yellow-400 shadow-sm"; rankStr = '<span class="text-xl">🥇</span>'; }
                else if (idx === 1) { bgClass = "bg-slate-100 border-slate-300"; rankStr = '<span class="text-lg">🥈</span>'; }
                else if (idx === 2) { bgClass = "bg-orange-100 border-orange-300"; rankStr = '<span class="text-lg">🥉</span>'; }

                el.className = `flex justify-between items-center p-2.5 rounded-xl border ${bgClass}`;
                el.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 text-center flex justify-center items-center">${rankStr}</div>
                        <div class="font-black text-slate-800 text-sm md:text-base">${s.name}</div>
                    </div>
                    <div class="font-black text-amber-600 math-font text-lg">${s.score} <span class="text-xs text-amber-700/70">分</span></div>
                `;
                list.appendChild(el);
            });
        }
    </script>

    <script>
        // =========================================================================
        // 1. 遊戲全域狀態與設定
        // =========================================================================
        let selectedGrade = 1; // 1~6 (小一~小六), 7~9 (國一~國三)
        let selectedTerm = 1;  // 1 (上學期), 2 (下學期)
        let selectedExam = 1;  // 國小: 1(期中), 2(期末), 3(綜合) | 國中: 1~3(段考), 4(全學期), 5(全年級), 6(三年)
        let selectedTopic = 'all'; // 'all' 代表綜合練習，或者具體單元名稱字串

        let score = 0;
        let combo = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let questionIndex = 0;
        let timeLeft = 90;
        let isPlaying = false;
        let isMuted = false;

        let gameTimerInterval = null;
        let moleWaveTimeout = null;
        let currentQuestion = null; // { q: '題目字串', a: '正解字串', distractors: ['錯1','錯2','錯3'], unit: '單元' }
        let answeredLog = [];       // 記錄作答歷程供結算檢視

        const TOTAL_HOLES = 6;
        // 紀錄每個洞口狀態：{ isUp: false, answer: '', isCorrect: false, hitLocked: false }
        let holeStates = Array.from({ length: TOTAL_HOLES }, () => ({
            isUp: false,
            answer: '',
            isCorrect: false,
            hitLocked: false
        }));

        // =========================================================================
        // 2. 音效合成器與輔助功能 (Web Audio API / 全螢幕)
        // =========================================================================
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('btn-sound');
            btn.innerText = isMuted ? '🔇 音效: 關' : '🔊 音效: 開';
        }

        // 全螢幕切換功能與跨平台相容性處理
        function toggleFullscreen() {
            const doc = window.document;
            const docEl = doc.documentElement;

            // 涵蓋主流瀏覽器與舊版的相容性前綴
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;
            const isFullscreen = doc.fullscreenElement || doc.mozFullScreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement;

            if (!isFullscreen) {
                if (requestFullScreen) {
                    try {
                        const promise = requestFullScreen.call(docEl);
                        if (promise) {
                            promise.catch(err => {
                                showGlobalToast('⚠️ 無法全螢幕：受限於平台的嵌入限制，或您的裝置不支援。');
                            });
                        }
                    } catch(err) {
                        showGlobalToast('⚠️ 無法全螢幕：受限於平台限制。');
                    }
                } else {
                    showGlobalToast('⚠️ 您的裝置 (如 iPhone) 不支援網頁原生全螢幕。');
                }
            } else {
                if (cancelFullScreen) {
                    cancelFullScreen.call(doc);
                }
            }
        }

        // 顯示全域浮動提示框 (Toast)
        function showGlobalToast(msg) {
            let toast = document.getElementById('global-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'global-toast';
                toast.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 z-[100] bg-rose-700 text-white px-5 py-2.5 rounded-2xl shadow-2xl font-bold text-sm md:text-base transition-opacity duration-300 pointer-events-none';
                document.body.appendChild(toast);
            }
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3500);
        }

        // 監聽全螢幕狀態改變
        const fsEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fsEvents.forEach(evt => {
            document.addEventListener(evt, () => {
                const btn = document.getElementById('btn-fullscreen');
                const isFullscreen = document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
                if (btn) {
                    btn.innerHTML = isFullscreen ? '🗗 退出全螢幕' : '⛶ 全螢幕';
                }
            });
        });

        function playSound(type) {
            if (isMuted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'whack') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(75, now + 0.12);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);       // C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.16); // G5
                osc.frequency.setValueAtTime(1046.5, now + 0.24); // C6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                osc.start(now);
                osc.stop(now + 0.45);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(115, now + 0.3);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now);
                osc.stop(now + 0.35);
            } else if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(480, now + 0.09);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
                osc.start(now);
                osc.stop(now + 0.09);
            }
        }

        // =========================================================================
        // 3. 108 課綱小一～國三 題庫模組化重構 (支援單一題型)
        // =========================================================================
        const GRADE_NAMES = {
            1: '國小一年級', 2: '國小二年級', 3: '國小三年級',
            4: '國小四年級', 5: '國小五年級', 6: '國小六年級',
            7: '國中一年級 (七年級)', 8: '國中二年級 (八年級)', 9: '國中三年級 (九年級)'
        };

        // 工具函式
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { let t = b; b = a % b; a = t; } return a || 1; }
        function makeNumericDistractors(correctVal, step = 1, allowNegative = false) {
            const set = new Set();
            const candidates = [correctVal + step, correctVal - step, correctVal + step * 2, correctVal - step * 2, correctVal + 10, correctVal - 10, correctVal + 3, correctVal - 3];
            for (let c of candidates) {
                if (!allowNegative && c < 0) continue;
                if (c !== correctVal) set.add(String(c));
                if (set.size >= 5) break;
            }
            while (set.size < 3) {
                let offset = randInt(1, 9) * (Math.random() < 0.5 ? 1 : -1);
                let val = correctVal + offset;
                if (!allowNegative && val < 0) val = correctVal + Math.abs(offset);
                if (val !== correctVal) set.add(String(val));
            }
            return Array.from(set).sort(() => Math.random() - 0.5).slice(0, 3);
        }

        // Q_BANK 定義所有題型 (g:年級, t:學期, e:段考次數, unit:單元名稱)
        const Q_BANK = [
            // ==================== 小一 ====================
            { g: 1, t: 1, e: 1, unit: '分與合(合起來)', fn: () => {
                const a = randInt(2, 5), b = randInt(1, 5); const ans = a + b;
                return { q: `${a} 和 ${b} 合起來是多少？`, a: String(ans), distractors: makeNumericDistractors(ans, 1) };
            }},
            { g: 1, t: 1, e: 1, unit: '分與合(分成)', fn: () => {
                const total = randInt(6, 10), part = randInt(1, total - 1); const ans = total - part;
                return { q: `${total} 可以分成 ${part} 和多少？`, a: String(ans), distractors: makeNumericDistractors(ans, 1) };
            }},
            { g: 1, t: 1, e: 2, unit: '10以內的加法', fn: () => {
                const a = randInt(2, 6), b = randInt(1, 10 - a);
                return { q: `${a} + ${b} = ?`, a: String(a + b), distractors: makeNumericDistractors(a + b, 1) };
            }},
            { g: 1, t: 1, e: 2, unit: '10以內的減法', fn: () => {
                const a = randInt(5, 10), b = randInt(1, a - 1);
                return { q: `${a} − ${b} = ?`, a: String(a - b), distractors: makeNumericDistractors(a - b, 1) };
            }},
            { g: 1, t: 2, e: 1, unit: '進位加法', fn: () => {
                const a = randInt(6, 9), b = randInt(5, 9);
                return { q: `${a} + ${b} = ?`, a: String(a + b), distractors: makeNumericDistractors(a + b, 1) };
            }},
            { g: 1, t: 2, e: 1, unit: '退位減法', fn: () => {
                const a = randInt(12, 18), b = randInt(4, 9);
                return { q: `${a} − ${b} = ?`, a: String(a - b), distractors: makeNumericDistractors(a - b, 1) };
            }},
            { g: 1, t: 2, e: 2, unit: '二位數加法', fn: () => {
                const tens = randInt(2, 6) * 10 + randInt(1, 4), add = randInt(1, 2) * 10 + randInt(1, 4);
                return { q: `${tens} + ${add} = ?`, a: String(tens + add), distractors: makeNumericDistractors(tens + add, 2) };
            }},
            { g: 1, t: 2, e: 2, unit: '認識錢幣', fn: () => {
                let c10 = randInt(2, 5), c1 = randInt(1, 8); if (c10 === c1) c1 = (c1 % 8) + 1;
                const ans = c10 * 10 + c1;
                return { q: `${c10} 個 10 元和 ${c1} 個 1 元，合起來幾元？`, a: `${ans}元`, distractors: [`${ans+10}元`, `${c1*10+c10}元`, `${ans-1}元`] };
            }},

            // ==================== 小二 ====================
            { g: 2, t: 1, e: 1, unit: '二位數進位加法', fn: () => {
                const a = randInt(25, 68), b = randInt(15, 29);
                return { q: `${a} + ${b} = ?`, a: String(a + b), distractors: makeNumericDistractors(a + b, 2) };
            }},
            { g: 2, t: 1, e: 1, unit: '二位數退位減法', fn: () => {
                const a = randInt(52, 95), b = randInt(16, 38);
                return { q: `${a} − ${b} = ?`, a: String(a - b), distractors: makeNumericDistractors(a - b, 2) };
            }},
            { g: 2, t: 1, e: 2, unit: '九九乘法', fn: () => {
                const m = choice([2, 4, 5, 8]), n = randInt(2, 9); const ans = m * n;
                return { q: `${m} × ${n} = ?`, a: String(ans), distractors: makeNumericDistractors(ans, m) };
            }},
            { g: 2, t: 2, e: 1, unit: '九九乘法(進階)', fn: () => {
                const m = randInt(3, 9), n = randInt(3, 9);
                return { q: `${m} × ${n} = ?`, a: String(m * n), distractors: makeNumericDistractors(m * n, 3) };
            }},
            { g: 2, t: 2, e: 1, unit: '長度換算', fn: () => {
                let m = randInt(2, 7), cm = randInt(10, 85); if (cm === 11 * m) cm += 5;
                const ans = m * 100 + cm;
                return { q: `${m} 公尺 ${cm} 公分 ＝ 幾公分？`, a: `${ans}公分`, distractors: [`${m*10+cm}公分`, `${ans+10}公分`, `${cm*10+m}公分`] };
            }},
            { g: 2, t: 2, e: 2, unit: '兩步驟問題', fn: () => {
                const a = randInt(3, 8), b = randInt(2, 6), c = randInt(4, 15); const ans = a * b + c;
                return { q: `${a} × ${b} + ${c} = ?`, a: String(ans), distractors: makeNumericDistractors(ans, 2) };
            }},
            { g: 2, t: 2, e: 2, unit: '立體圖形', fn: () => {
                return choice([
                    { q: '正方體總共有幾個面？', a: '6個', distractors: ['4個', '8個', '12個'] },
                    { q: '正方體總共有幾個頂點？', a: '8個', distractors: ['6個', '10個', '12個'] },
                    { q: '正方體總共有幾條邊？', a: '12條', distractors: ['6條', '8條', '16條'] }
                ]);
            }},

            // ==================== 小三 ====================
            { g: 3, t: 1, e: 1, unit: '二位數乘法', fn: () => {
                const a = randInt(12, 45), b = randInt(3, 8); const ans = a * b;
                return { q: `${a} × ${b} = ?`, a: String(ans), distractors: makeNumericDistractors(ans, b) };
            }},
            { g: 3, t: 1, e: 2, unit: '除法概念', fn: () => {
                const d = randInt(3, 9), q = randInt(4, 9); const total = d * q;
                return { q: `${total} ÷ ${d} = ?`, a: String(q), distractors: makeNumericDistractors(q, 1) };
            }},
            { g: 3, t: 1, e: 2, unit: '圓的認識', fn: () => {
                const r = randInt(3, 15);
                return { q: `圓的半徑是 ${r} 公分，直徑是幾公分？`, a: `${r * 2}公分`, distractors: [`${r}公分`, `${r + 2}公分`, `${r * 3}公分`] };
            }},
            { g: 3, t: 2, e: 1, unit: '除法直式計算', fn: () => {
                const d = randInt(3, 8), q = randInt(12, 28);
                return { q: `${d * q} ÷ ${d} = ?`, a: String(q), distractors: makeNumericDistractors(q, 2) };
            }},
            { g: 3, t: 2, e: 1, unit: '時間換算', fn: () => {
                const hr = randInt(1, 4), min = randInt(10, 50); const ans = hr * 60 + min;
                return { q: `${hr} 小時 ${min} 分鐘 ＝ 幾分鐘？`, a: `${ans}分`, distractors: [`${hr*100+min}分`, `${ans+20}分`, `${ans-10}分`] };
            }},
            { g: 3, t: 2, e: 2, unit: '同分母分數加減', fn: () => {
                const den = randInt(5, 11), a = randInt(1, den - 3), b = randInt(1, den - a - 1);
                return { q: `${a}/${den} + ${b}/${den} = ?`, a: `${a + b}/${den}`, distractors: [`${a + b}/${den * 2}`, `${a + b + 1}/${den}`, `${Math.abs(a - b)}/${den}`] };

            // 3. 動態產生考試範圍按鈕 (國中 6 種 / 國小 3 種)

                    { id: 4, label: '全學期綜合' }, { id: 5, label: '全年級綜合' }, { id: 6, label: '國中三年總複習' }
                ]
                : [
                    { id: 1, label: '期中考範圍' }, { id: 2, label: '期末考範圍' }, { id: 3, label: '全學期綜合' }
                ];

            // 若國小切換到原本的 4,5,6，防呆拉回 3
            if (!isJunior && selectedExam > 3) selectedExam = 3;

            examOptions.forEach(opt => {
                const b = document.createElement('button');
                b.onclick = () => selectExam(opt.id);

                if (opt.id === selectedExam) {

                }
                examContainer.appendChild(b);
            });

            // 4. 動態產生「單一題型」按鈕
            const topicContainer = document.getElementById('topic-buttons-container');
            if (topicContainer) {
                topicContainer.innerHTML = '';
                
                // 計算當前範圍內的所有題目
                let pool = Q_BANK;
                if (isJunior && selectedExam === 6) pool = pool.filter(q => q.g >= 7);
                else if (isJunior && selectedExam === 5) pool = pool.filter(q => q.g === selectedGrade);
                else if (selectedExam === 4 || (!isJunior && selectedExam === 3)) pool = pool.filter(q => q.g === selectedGrade && q.t === selectedTerm);
                else pool = pool.filter(q => q.g === selectedGrade && q.t === selectedTerm && q.e === selectedExam);

                const uniqueTopics = [...new Set(pool.map(q => q.unit))];

                // 綜合練習按鈕
                const btnAll = document.createElement('button');
                btnAll.onclick = () => selectTopic('all');
                btnAll.innerText = '🎲 綜合練習 (全範圍)';
                btnAll.className = selectedTopic === 'all' 
                    ? "py-2 px-3 rounded-lg font-black text-xs md:text-sm border-2 bg-indigo-700 text-yellow-200 border-indigo-950 shadow-md transition-all"

                topicContainer.appendChild(btnAll);

                uniqueTopics.forEach(topic => {

            const termName = selectedTerm === 1 ? '上學期' : '下學期';
            const examName = examOptions.find(x => x.id === selectedExam)?.label || '';
            document.getElementById('current-scope-badge').innerText = `${GRADE_NAMES[selectedGrade]} ｜ ${termName} ｜ ${examName}`;
        }

        // =========================================================================
        // 5. 動態數學題庫出題引擎
        // =========================================================================
        function generateMathQuestion(grade, term, exam) {
            let pool = Q_BANK;

            // 依據選擇的學制與範圍過濾題庫
            if (grade >= 7 && exam === 6) {
                pool = pool.filter(q => q.g >= 7); // 國中三年總複習
            } else if (grade >= 7 && exam === 5) {
                pool = pool.filter(q => q.g === grade); // 該年級全年級綜合
            } else if (exam === 4 || (grade <= 6 && exam === 3)) {
                pool = pool.filter(q => q.g === grade && q.t === term); // 全學期綜合
            } else {
                pool = pool.filter(q => q.g === grade && q.t === term && q.e === exam); // 指定段考
            }

            // 若選擇了特定單一題型，再次過濾
            if (selectedTopic !== 'all') {
                const filtered = pool.filter(q => q.unit === selectedTopic);
                if (filtered.length > 0) pool = filtered; 
            }

            // 隨機抽出一題執行
            const picked = choice(pool);
            let qObj = picked.fn();
            qObj.unit = picked.unit;

            // --- 🔧 通用修正機制：確保所有選項絕對不會重複 ---
            const finalDistractors = new Set();
            for (let d of qObj.distractors) {
                if (String(d) !== String(qObj.a)) {
                    finalDistractors.add(String(d));
                }
            }
            
            let fallbackNum = 1;
            while (finalDistractors.size < 3) {
                let ansStr = String(qObj.a);
                let numMatch = ansStr.match(/-?\d+/); 
                if (numMatch) {
                    let baseNum = parseInt(numMatch[0], 10);
                    let replaced = ansStr.replace(/-?\d+/, String(baseNum + fallbackNum));
                    if (replaced !== ansStr && !finalDistractors.has(replaced)) {
                        finalDistractors.add(replaced);
                    }
                } else {
                    let fallbackStr = ansStr + " (錯" + fallbackNum + ")";
                    if (!finalDistractors.has(fallbackStr)) {
                        finalDistractors.add(fallbackStr);
                    }
                }
                
                if (fallbackNum > 0) fallbackNum = -fallbackNum;
                else fallbackNum = -fallbackNum + 1;
            }
            
            qObj.distractors = Array.from(finalDistractors).slice(0, 3);
            return qObj;
        }

        // =========================================================================
        // 7. 舞台初始化與遊戲迴圈控制
        // =========================================================================
        function buildHolesStage() {
            const stage = document.getElementById('holes-stage');
            stage.innerHTML = '';

            for (let i = 0; i < TOTAL_HOLES; i++) {
                const slot = document.createElement('div');
                slot.className = "relative flex flex-col items-center justify-end h-44 md:h-52 select-none";
                slot.innerHTML = `
                    <!-- 地鼠鑽出遮罩區 -->
                    <div class="mole-mask absolute bottom-6 w-44 h-48 flex items-end justify-center z-10 cursor-pointer" onclick="whackHole(${i})">
                        <div id="mole-wrap-${i}" class="mole-wrapper flex items-center justify-center">
                            <div id="mole-svg-${i}"></div>
                        </div>
                    </div>

                    <!-- 立體土丘與深坑洞口 -->
                    <div onclick="whackHole(${i})" class="dirt-mound w-40 sm:w-44 md:w-52 h-16 md:h-20 rounded-[50%] flex items-center justify-center relative z-0 cursor-pointer">
                        <div class="hole-pit w-32 sm:w-36 md:w-44 h-10 md:h-12 rounded-[50%] border-2 border-amber-950"></div>
                    </div>

                    <!-- 前景小草叢遮擋地洞下緣 -->
                    <div class="pointer-events-none relative z-20 -mt-3 flex items-center justify-between w-36 px-2 text-xs md:text-sm opacity-90">
                        <span>🌱</span><span>🌿</span><span>🌱</span>
                    </div>

                    <!-- 槌子與飄字特效層 -->
                    <div id="fx-layer-${i}" class="pointer-events-none absolute inset-0 z-30 flex items-center justify-center"></div>
                `;
                stage.appendChild(slot);
            }
        }

        function startGame() {
            initAudio();
            isPlaying = true;
            score = 0;
            combo = 0;
            correctCount = 0;
            wrongCount = 0;
            questionIndex = 0;
            timeLeft = 90;
            answeredLog = [];

            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');

            const gameScreen = document.getElementById('game-screen');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            document.getElementById('btn-back-menu').classList.remove('hidden');

            buildHolesStage();
            updateScoreUI();
            document.getElementById('timer-display').innerText = timeLeft;

            // 出第一題並啟動地鼠波次
            nextQuestion();

            if (gameTimerInterval) clearInterval(gameTimerInterval);
            gameTimerInterval = setInterval(() => {
                if (!isPlaying) return;
                timeLeft--;
                const timerEl = document.getElementById('timer-display');
                timerEl.innerText = timeLeft;
                if (timeLeft <= 10) {
                    timerEl.className = "text-xl md:text-2xl font-black text-rose-400 animate-ping math-font";
                } else {
                    timerEl.className = "text-xl md:text-2xl font-black text-emerald-300 math-font";
                }

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function returnToMenu() {
            isPlaying = false;
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            if (moleWaveTimeout) clearTimeout(moleWaveTimeout);

            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('result-modal').classList.remove('flex');
            document.getElementById('btn-back-menu').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

        // 切換下一道數學題
        function nextQuestion() {
            if (!isPlaying) return;
            if (moleWaveTimeout) clearTimeout(moleWaveTimeout);

            questionIndex++;
            currentQuestion = generateMathQuestion(selectedGrade, selectedTerm, selectedExam);

            document.getElementById('question-unit-tag').innerText = `📌 ${currentQuestion.unit}`;
            document.getElementById('question-counter-tag').innerText = `第 ${questionIndex} 題`;
            document.getElementById('question-text').innerText = currentQuestion.q;

            // 先把所有地鼠縮回洞裡，短暫延遲後冒出新的一波舉牌地鼠
            hideAllMoles();
            moleWaveTimeout = setTimeout(() => {
                spawnMoleWave();
            }, 340);
        }

        function skipQuestion() {
            if (!isPlaying) return;
            nextQuestion();
            showBanner('🔄 已切換新題目！', 'text-amber-700');
            setTimeout(() => {
                const banner = document.getElementById('feedback-banner');
                if (banner.innerText.includes('換新題目')) {
                    banner.className = 'h-6 text-sm md:text-base font-extrabold transition-opacity opacity-0';
                }
            }, 1500);
        }

        function hideAllMoles() {
            for (let i = 0; i < TOTAL_HOLES; i++) {
                holeStates[i].isUp = false;
                holeStates[i].hitLocked = false;
                const wrap = document.getElementById(`mole-wrap-${i}`);
                if (wrap) {
                    wrap.className = 'mole-wrapper flex items-center justify-center';
                }
            }
        }

        // 讓 4 隻地鼠隨機從 6 個洞口冒出（1隻舉正解，3隻舉誘答）
        function spawnMoleWave() {
            if (!isPlaying || !currentQuestion) return;
            hideAllMoles();

            // 隨機挑選 4 個洞口
            const indices = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5).slice(0, 4);
            const options = [
                { ans: currentQuestion.a, isCorrect: true },
                { ans: currentQuestion.distractors[0], isCorrect: false },
                { ans: currentQuestion.distractors[1], isCorrect: false },
                { ans: currentQuestion.distractors[2], isCorrect: false }
            ].sort(() => Math.random() - 0.5);

            playSound('pop');

            indices.forEach((holeIdx, idx) => {
                const opt = options[idx];
                holeStates[holeIdx] = {
                    isUp: true,
                    answer: opt.ans,
                    isCorrect: opt.isCorrect,
                    hitLocked: false
                };

                const svgContainer = document.getElementById(`mole-svg-${holeIdx}`);
                const wrap = document.getElementById(`mole-wrap-${holeIdx}`);
                if (svgContainer && wrap) {
                    svgContainer.innerHTML = getPlacardMoleSVG(opt.ans, 'normal');
                    wrap.className = 'mole-wrapper up flex items-center justify-center';
                }
            });

            // 根據玩家選擇的速度決定地鼠停留秒數，若沒打中正解則換洞重新冒出！
            const speedMode = document.getElementById('speed-select').value;
            const stayDuration = speedMode === 'slow' ? 4600 : (speedMode === 'fast' ? 2500 : 3500);

            if (moleWaveTimeout) clearTimeout(moleWaveTimeout);
            moleWaveTimeout = setTimeout(() => {
                if (!isPlaying) return;
                hideAllMoles();
                moleWaveTimeout = setTimeout(() => {
                    spawnMoleWave();
                }, 400);
            }, stayDuration);
        }

        // 玩家點擊敲擊某個地洞
        function whackHole(index) {
            if (!isPlaying) return;
            const state = holeStates[index];
            if (!state.isUp || state.hitLocked) return;

            state.hitLocked = true;
            playSound('whack');

            const fxLayer = document.getElementById(`fx-layer-${index}`);
            const svgContainer = document.getElementById(`mole-svg-${index}`);
            const wrap = document.getElementById(`mole-wrap-${index}`);
            const board = document.getElementById('question-board');

            // 觸發畫面震動
            board.classList.remove('shake-active');
            void board.offsetWidth;
            board.classList.add('shake-active');

            if (state.isCorrect) {
                // ======= 打中正確答案地鼠 =======
                if (moleWaveTimeout) clearTimeout(moleWaveTimeout);
                playSound('correct');

                combo++;
                correctCount++;
                const bonus = combo >= 3 ? 5 : 0;
                const addPts = 10 + bonus;
                score += addPts;
                window.score = score; // 同步至全域供排行榜使用
                updateScoreUI();

                // 紀錄答對
                answeredLog.unshift({
                    q: currentQuestion.q,
                    picked: state.answer,
                    correctAns: currentQuestion.a,
                    isCorrect: true
                });

                // 替換為眼冒金星的地鼠與敲擊特效
                svgContainer.innerHTML = getPlacardMoleSVG(state.answer, 'correct');
                wrap.className = 'mole-wrapper hit-correct flex items-center justify-center';

                fxLayer.innerHTML = `
                    <div class="hammer-anim absolute -top-6 right-4 z-40">${getHammerSVG()}</div>
                    <div class="score-float absolute top-4 left-1/2 z-50 bg-emerald-600 text-yellow-200 border-2 border-yellow-300 px-3 py-1 rounded-full font-black text-lg shadow-lg whitespace-nowrap">
                        ⭕ +${addPts} 分!
                    </div>
                `;

                showBanner(`🎉 答對了！正確答案就是 ${state.answer}（+${addPts}分）`, 'text-emerald-700');

                setTimeout(() => {
                    fxLayer.innerHTML = '';
                    // 切換題目時，務必將上一題的提示橫幅隱藏，避免殘留
                    document.getElementById('feedback-banner').className = 'h-6 text-sm md:text-base font-extrabold transition-opacity opacity-0';
                    nextQuestion();
                }, 700);

            } else {
                // ======= 打錯地鼠 (扣分並縮回該隻地鼠) =======
                playSound('wrong');
                combo = 0;
                wrongCount++;
                score = Math.max(0, score - 5);
                updateScoreUI();

                // 紀錄誤擊
                answeredLog.unshift({
                    q: currentQuestion.q,
                    picked: state.answer,
                    correctAns: currentQuestion.a,
                    isCorrect: false
                });

                svgContainer.innerHTML = getPlacardMoleSVG(state.answer, 'wrong');
                wrap.className = 'mole-wrapper hit-wrong flex items-center justify-center';

                fxLayer.innerHTML = `
                    <div class="hammer-anim absolute -top-6 right-4 z-40">${getHammerSVG()}</div>
                    <div class="score-float absolute top-4 left-1/2 z-50 bg-rose-600 text-white border-2 border-rose-200 px-3 py-1 rounded-full font-black text-lg shadow-lg whitespace-nowrap">
                        ❌ -5 分
                    </div>
                `;

                showBanner(`⚠️ 敲錯囉！「${state.answer}」不是正確答案，再找找看！`, 'text-rose-600');

                setTimeout(() => {
                    state.isUp = false;
                    fxLayer.innerHTML = '';
                }, 550);
            }
        }

        function updateScoreUI() {
            document.getElementById('score-display').innerText = score;
            const comboBadge = document.getElementById('combo-badge');
            const comboDisplay = document.getElementById('combo-display');
            if (combo >= 2) {
                comboBadge.classList.remove('hidden');
                comboBadge.classList.add('flex');
                comboDisplay.innerText = combo;
            } else {
                comboBadge.classList.add('hidden');
                comboBadge.classList.remove('flex');
            }
        }

        function showBanner(msg, colorClass) {
            const banner = document.getElementById('feedback-banner');
            banner.innerText = msg;
            banner.className = `h-6 text-sm md:text-base font-extrabold transition-opacity opacity-100 ${colorClass}`;
        }

        // =========================================================================
        // 8. 遊戲結束結算與解題回顧
        // =========================================================================
        function endGame() {
            isPlaying = false;
            if (gameTimerInterval) clearInterval(gameTimerInterval);
            if (moleWaveTimeout) clearTimeout(moleWaveTimeout);
            hideAllMoles();

            document.getElementById('final-score').innerText = score;
            document.getElementById('final-correct').innerText = correctCount;
            document.getElementById('final-wrong').innerText = wrongCount;
            document.getElementById('result-scope-title').innerText = document.getElementById('current-scope-badge').innerText;

            window.score = score; // 結算時確保分數同步

            // 重置提交成績按鈕狀態
            const submitBtn = document.getElementById('submit-score-btn');
            const nameInput = document.getElementById('player-name');
            if(submitBtn && nameInput) {
                submitBtn.disabled = false;
                submitBtn.innerText = '送出成績';
                submitBtn.className = 'px-4 py-2 bg-gradient-to-b from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 text-white rounded-lg font-bold transition shadow cursor-pointer whitespace-nowrap';
                if(score <= 0) {
                    submitBtn.disabled = true;
                    submitBtn.innerText = '0分無法登記';
                    submitBtn.className = 'px-4 py-2 bg-slate-400 text-white rounded-lg font-bold shadow cursor-not-allowed whitespace-nowrap';
                }
            }

            const listEl = document.getElementById('history-list');
            listEl.innerHTML = '';

            if (answeredLog.length === 0) {
                listEl.innerHTML = `<div class="text-center text-amber-800/70 py-4 text-sm font-bold">本局尚未敲擊任何地鼠喔！</div>`;
            } else {
                answeredLog.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `p-2.5 rounded-xl border-2 text-xs md:text-sm flex flex-col sm:flex-row sm:items-center justify-between gap-1 ${
                        item.isCorrect ? 'bg-emerald-50 border-emerald-500/60 text-emerald-950' : 'bg-rose-50 border-rose-500/60 text-rose-950'
                    }`;
                    row.innerHTML = `
                        <div class="font-bold math-font">${item.isCorrect ? '⭕' : '❌'} ${item.q}</div>
                        <div class="shrink-0 font-black">
                            ${item.isCorrect
                                ? `<span class="text-emerald-700">命中正解：${item.correctAns}</span>`
                                : `<span class="text-rose-600 mr-2">誤擊：${item.picked}</span><span class="text-emerald-700">正解：${item.correctAns}</span>`
                            }
                        </div>
                    `;
                    listEl.appendChild(row);
                });
            }

            const modal = document.getElementById('result-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // 網頁載入時初始化選單
        window.onload = function () {
            window.selectedGrade = selectedGrade;
            updateMenuUI();
        };

        // =========================================================================
        // 9. 排行榜 UI 控制函式
        // =========================================================================
        window.openLeaderboard = function() {
            document.getElementById('leaderboard-modal').classList.remove('hidden');
            document.getElementById('leaderboard-modal').classList.add('flex');
            document.getElementById('leaderboard-grade-select').value = window.selectedGrade;
            if(window.fetchAndShowLeaderboard) {
                window.fetchAndShowLeaderboard(window.selectedGrade);
            }
        };

        window.closeLeaderboard = function() {
            document.getElementById('leaderboard-modal').classList.add('hidden');
            document.getElementById('leaderboard-modal').classList.remove('flex');
        };

        window.submitScoreAction = function() {
            const nameInput = document.getElementById('player-name');
            const name = nameInput.value;
            if(!name.trim()) {
                nameInput.classList.add('ring-2', 'ring-rose-500');
                setTimeout(() => nameInput.classList.remove('ring-2', 'ring-rose-500'), 1000);
                return;
            }
            if(window.submitScoreToCloud) {
                window.submitScoreToCloud(name);
            }
        };
    </script>
</body>
</html>
